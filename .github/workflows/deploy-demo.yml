# The only sanctioned way https://midnightpassport.com is updated.
#
# THE RULE
# --------
# Only what is on `main` is deployed. A release is the trigger, and the guard
# below refuses any ref whose commit is not an ancestor of `origin/main` — so a
# release cut from a feature branch cannot ship, however it was tagged. This
# replaces `npm run deploy:passport` from a developer laptop, which is now
# `deploy:passport:manual` and is break-glass only. See docs/demo/deployment.md.
#
# A RUN THAT NAMES A RELEASE BUILDS THAT RELEASE. The checkout takes
# `inputs.release_tag` as its ref, so a promotion builds the immutable tag
# rather than whatever the dispatch was started from, and a production
# promotion additionally has to be dispatched FROM that tag so the commit the
# run reports is the commit it shipped.
#
# WHY THIS IS NOT A PLAIN `npm ci && npm run build`
# --------------------------------------------------
# `examples/passport-demo`'s build stages ~97 MB of prover keys and ZKIR from
# `examples/passport-balancer/contracts-stagenet/managed/*/{keys,zkir}`. Those
# two directories are gitignored; the `contract/` and `compiler/` halves beside
# them are tracked. A fresh checkout therefore fails at `prepare:zk` with
# "the account build is incomplete — keys/ is missing" (confirmed in this repo
# on 2026/08/26), which is the honest failure but not a deploy.
#
# They cannot be rebuilt here. The manifests name compiler 0.33.0 (0.33.0-rc.2)
# and `compact list` offers 0.31.1 then 0.34.0 — the compiler that produced what
# is deployed on stagenet is not installable. Recompiling with a different one
# would produce different verifier keys, and the deployed contract knows only
# the keys it was deployed with.
#
# So the bundle travels WITH the release, as an asset, and is verified against
# the tracked manifests before anything is built. Cutting a release therefore
# has one manual step — attaching that asset — and docs/demo/deployment.md
# gives the exact command.

name: Deploy Passport demo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The release to deploy, as v<major>.<minor> (for example v1.0; a fix moves the decimal, a feature the whole number). THE COMMIT DEPLOYED IS THE ONE THIS TAG POINTS AT, and its ZK artefact bundle is the one built with. The legacy undotted v1-v16 still resolve, for a rollback to one of them. Blank deploys this run''s ref and takes the bundle from scripts/zk-artefacts.lock.json; a production deploy must name a tag, and must be dispatched from that tag.'
        required: false
        type: string
      target:
        description: 'Where to deploy. A published release always goes to staging; production is only ever a promotion of a release that was confirmed on staging (delivery rule, 2026/09/15).'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# One production deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-passport-demo
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  VERCEL_CLI_VERSION: '59.3.0'
  # A release lands on staging; production is a separate, deliberate dispatch.
  DEPLOY_TARGET: ${{ github.event_name == 'release' && 'staging' || inputs.target }}
  ZK_BUNDLE_ASSET: passport-zk-artefacts.tar.zst
  MANAGED_ROOT: examples/passport-balancer/contracts-stagenet/managed

  # Exactly the values the old `deploy:passport` built with. Kept here rather
  # than in the npm script so that what ships is visible in the run log, and so
  # `deploy:passport:manual` and this workflow cannot drift apart silently.
  #
  # PROVING AND FEE SPONSORSHIP TAKE A LIST (2026/08/31). Both variables are
  # comma-separated and tried left to right, per request, falling through on a
  # failure or a timeout. Until today all four of proving, fee sponsorship,
  # sponsored name registration, and activation grants rode one host; the two
  # that have a second provider on stagenet now name it.
  #
  # OUR BALANCER IS FIRST, AND THE 1AM GATEWAY IS A WORKING SECOND. The order
  # is a measurement, and the measurement has already moved once.
  #
  # On 2026/08/31 the gateway could not serve us at all: its prover-enclave
  # answered `POST /prove` and `POST /check` with `expected header tag
  # 'midnight:ir-source[v3-generic]:', got 'midnight:ir-source[v2]:'`, and
  # `POST /balance-only` with `BALANCE_FAILED: Failed to prove transaction` for
  # the same reason, since it proves the dust leg on the same enclave. Our
  # artefacts are Compact 0.33.0-rc.2 and zkir-v2, which emit v2, and they
  # cannot be rebuilt: that compiler is no longer installable and the deployed
  # contract's verifier keys travel with a release.
  #
  # On 2026/09/01 1AM shipped a build named `ledger9-zkir2-dispatch`
  # (`binaryHash` a02f9c81 to fd377eaf) and it now serves us. Re-drilled the
  # same day, gateway first, through a logging proxy. Every call a 200:
  #
  #   POST /balance-only  200  1331 ms  in  19330 B  out 45303 B   (deploy)
  #   POST /check         200   191 ms  in   1388 B  out    72 B
  #   POST /prove         200   561 ms  in 283375 B  out  2940 B   (add_grant)
  #   POST /balance-only  200   935 ms  in   3735 B  out 14095 B
  #
  # It is still second, and that is now a judgement rather than a fact. The fix
  # is one day old, `release.services` in the gateway's own /health still
  # reports the superseded git_commit 7f6a497 with `git_dirty: true`, and
  # stagenet is explicitly an experimental environment. The cost of being wrong
  # is asymmetric: a 429 from the gateway's balance wallet falls through in
  # 144 ms, measured under deliberate contention, but a REGRESSION TO 500 costs
  # about seven seconds per circuit, because midnight-js's own proof-server
  # client retries a 500 three times with 1/2/4 s backoff. That is what made
  # the broken gateway cost 41-43 s per contract call against 24 s with the
  # balancer first.
  #
  # The argument for flipping, once it has held for a while: our balancer is
  # the ONLY thing that can serve /register-alias and /fund-account, so every
  # DUST speck the gateway pays for a fee is one our balancer keeps for the
  # path that has no second provider at all.
  #
  # `VITE_FUNDER_URL` is a single URL here because there is only one Passport
  # sponsor today: `/register-alias` and `/fund-account` exist nowhere but our
  # balancer (the gateway 404s both). Since 2026/09/07 the client accepts an
  # ordered list and fails over only on unreachability, so a standby sponsor
  # is one more address on this line, not a code change.
  #
  # THE BALANCER IS NAMED BY ITS SSLIP.IO ADDRESS, NOT BY A DNS RECORD
  # (2026/09/02). The friendly name this file used until today still resolves,
  # but to a RECYCLED address: the 1 GB droplet it pointed at was deleted on
  # 2026/08/27 and its IP was handed to somebody else, so the record now names
  # a stranger's Caddy — which is why its ACME renewal has been failing hourly
  # ever since. Every production deploy that worked was built with the values
  # below passed in by hand; this file was the last place still carrying the
  # dead name, and a build that took its defaults from it would have shipped
  # proving and sponsorship pointed at a host that is not ours. sslip.io
  # encodes the address in the name, so there is no record left to go stale.
  VITE_MIDNIGHT_NETWORK_ID: stagenet
  VITE_MIDNIGHT_PROVING_URL: https://67-205-177-162.sslip.io/prover,https://api-stagenet.1am.xyz
  VITE_SPONSOR_URL: https://67-205-177-162.sslip.io/balancer,https://api-stagenet.1am.xyz
  VITE_FUNDER_URL: https://67-205-177-162.sslip.io/balancer
  VITE_RAFFLE_URL: https://raffle.midnightpassport.com

jobs:
  deploy:
    name: Build and deploy to Vercel (staging on release, production on request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 — `git merge-base --is-ancestor` below needs real
      # history, and a shallow clone has none.
      #
      # `ref:` IS THE RELEASE, NOT THE RUN'S REF. A dispatch that names
      # `release_tag` used to build whatever the run was started from and take
      # only the ZK bundle from the tag, so "promote v1.0 to production" from a
      # branch that had moved on shipped the branch and called it v1.0
      # (2026/09/15). The tag is immutable, so naming it here makes the release
      # body, the tree that is built, and what reaches the site one revision.
      # A release event leaves `inputs` empty and falls through to `github.sha`,
      # which for that event already IS the tag's commit.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  #v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}

      # ---------------------------------------------------------------------
      # THE GUARD. Nothing installs, builds, or deploys before this passes.
      # ---------------------------------------------------------------------
      - name: Refuse to deploy a commit that is not on main
        env:
          # Through env, never interpolated into the shell: a tag name is
          # attacker-shaped input the moment anyone can cut a release.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # Written as a full refspec rather than `git fetch origin main`, which
          # relies on whatever `remote.origin.fetch` the checkout left behind.
          # Every line below resolves `origin/main`, and the checkout is now
          # detached at a tag when a release is named, so this makes the
          # remote-tracking ref exist because this command created it.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

          if [ -n "${RELEASE_TAG}" ]; then
            git fetch --quiet origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" || true
            target="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            echo "Release ${RELEASE_TAG} points at ${target}, and that is the tree checked out above."

            # GITHUB_SHA is still the ref the run was STARTED from. It is what
            # the summary reports, what the deployment is recorded against, and
            # what anyone reading the run believes shipped — so for production
            # it has to be the same commit as the release being promoted. The
            # checkout above already builds the tag either way; this is what
            # stops the run from describing itself wrongly.
            if [ "${DEPLOY_TARGET}" = "production" ] && [ "${target}" != "${GITHUB_SHA}" ]; then
              echo "::error::This run was started from ${GITHUB_SHA}, and ${RELEASE_TAG} points at ${target}."
              echo "::error::A production deploy promotes exactly one release. Dispatch this workflow from the tag itself: Run workflow -> Use workflow from -> Tags -> ${RELEASE_TAG}."
              exit 1
            fi
          else
            target="${GITHUB_SHA}"
            echo "Manual run against ${GITHUB_REF} (${target})."
          fi

          if git merge-base --is-ancestor "$target" origin/main; then
            echo "${target} is on origin/main ($(git rev-parse origin/main)). Proceeding."
          else
            echo "::error::${target} is NOT an ancestor of origin/main ($(git rev-parse origin/main))."
            echo "::error::Only what is on main is deployed. Merge this work into main and cut the release (v<major>.<minor>) from main."
            exit 1
          fi

      # main did not carry examples/passport-demo when this workflow was
      # written — the app was still on a stack of feature branches. Without this
      # step, a release cut before the merge lands would sail through every gate
      # (npm test on nothing, a build of nothing) and upload an empty directory
      # over the live site.
      - name: Refuse to deploy a ref that has no demo
        run: |
          set -euo pipefail
          missing=0
          for path in \
            examples/passport-demo/package.json \
            examples/passport-demo/vercel.json \
            examples/passport-demo/.vercel-output-exclude \
            scripts/build-vercel-output.mjs \
            demo-backend/package.json \
            "${MANAGED_ROOT}/account/compiler/contract-manifest.json" \
            "${MANAGED_ROOT}/midnames/compiler/contract-manifest.json"
          do
            if [ ! -f "$path" ]; then
              echo "::error::${path} is missing on this ref."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to deploy: this ref does not contain the Passport demo. Deploying it would overwrite the live site with nothing."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # WHERE THIS IS GOING, DECIDED BEFORE ANYTHING IS BUILT.
      #
      # Two projects, one direction of travel: a published release is deployed
      # to the STAGING project; the production project is deployed only by a
      # dispatch that names `target: production`, after the release was
      # confirmed on staging (delivery rule, .claude/CLAUDE.md, 2026/09/15).
      #
      # Both checks used to sit just before `vercel deploy`, forty minutes of
      # gates later. Failing here costs seconds.
      # ---------------------------------------------------------------------
      - name: Refuse a production deploy that names no release
        if: env.DEPLOY_TARGET == 'production' && inputs.release_tag == ''
        run: |
          echo "::error::A production deploy promotes a release that was confirmed on staging. Name it in release_tag, as v<major>.<minor> (for example v1.0)."
          exit 1

      # `.vercel/project.json` is gitignored, so the CLI is told which project
      # this is through the environment instead. Both ids are non-secret
      # identifiers; they are repository secrets so that all five deploy inputs
      # are managed in one place.
      #
      # RESOLVED IN A STEP, NOT IN `${{ cond && secrets.A || secrets.B }}`.
      # That expression silently yields the STAGING id whenever the production
      # one is unset, because an empty secret is falsey and `||` then takes the
      # right-hand side — so the one configuration mistake this most needs to
      # catch, a production secret that was never added, deployed the build to
      # staging a second time and reported it as production (2026/09/15). Here
      # the per-target pair is checked explicitly and the missing secret is
      # named.
      - name: Resolve the Vercel project for this target
        id: vercel-project
        env:
          PRODUCTION_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
          STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${DEPLOY_TARGET}" = "production" ]; then
            org_secret=VERCEL_ORG_ID
            project_secret=VERCEL_PROJECT_ID
            org_id="${PRODUCTION_ORG_ID}"
            project_id="${PRODUCTION_PROJECT_ID}"
          else
            org_secret=VERCEL_STAGING_ORG_ID
            project_secret=VERCEL_STAGING_PROJECT_ID
            org_id="${STAGING_ORG_ID}"
            project_id="${STAGING_PROJECT_ID}"
          fi

          missing=0
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not set as a repository secret."
            missing=1
          fi
          if [ -z "${org_id}" ]; then
            echo "::error::${org_secret} is not set as a repository secret, and it is the ${DEPLOY_TARGET} organisation id."
            missing=1
          fi
          if [ -z "${project_id}" ]; then
            echo "::error::${project_secret} is not set as a repository secret, and it is the ${DEPLOY_TARGET} project id."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Refusing to deploy to ${DEPLOY_TARGET} without its own project ids — the other target's would deploy to the other site. The five secrets are listed in docs/demo/deployment.md."
            exit 1
          fi

          echo "org_id=${org_id}" >> "$GITHUB_OUTPUT"
          echo "project_id=${project_id}" >> "$GITHUB_OUTPUT"
          echo "Deploying to the ${DEPLOY_TARGET} project, from ${org_secret} and ${project_secret}."

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # ---------------------------------------------------------------------
      # Build inputs that are deliberately not in git.
      # ---------------------------------------------------------------------
      - name: Restore the pinned ZK artefacts
        id: zk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  #v6.1.0
        with:
          key: zk-artefacts-${{ hashFiles('examples/passport-balancer/contracts-stagenet/managed/*/compiler/contract-manifest.json') }}
          path: |
            examples/passport-balancer/contracts-stagenet/managed/account/keys
            examples/passport-balancer/contracts-stagenet/managed/account/zkir
            examples/passport-balancer/contracts-stagenet/managed/midnames/keys
            examples/passport-balancer/contracts-stagenet/managed/midnames/zkir

      # Hard failure here, unlike verify-demo.yml. A deploy that cannot build
      # must not be green.
      #
      # THE BUNDLE IS ALWAYS FETCHED BY TAG. `gh release download` with no tag
      # takes whatever is Latest at the moment the step runs, which is a
      # different build from the one being deployed the instant anyone cuts a
      # release while a promotion is in flight. A run that names a release uses
      # that release's asset; a run that names none uses the pin in
      # scripts/zk-artefacts.lock.json, which is the same asset a Vercel
      # builder and a developer on a fresh clone get. Nothing here resolves to
      # "newest".
      - name: Fetch the ZK artefact bundle
        if: steps.zk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY}"
          tag="${RELEASE_TAG}"
          if [ -z "${tag}" ]; then
            tag="$(node -p 'JSON.parse(require("node:fs").readFileSync("scripts/zk-artefacts.lock.json", "utf8")).tag')"
            repository="$(node -p 'JSON.parse(require("node:fs").readFileSync("scripts/zk-artefacts.lock.json", "utf8")).repository')"
            echo "This run names no release, so the bundle comes from the pin in scripts/zk-artefacts.lock.json."
          fi

          echo "Downloading ${ZK_BUNDLE_ASSET} from ${repository} ${tag}."
          if ! gh release download "${tag}" --repo "${repository}" --pattern "${ZK_BUNDLE_ASSET}" --dir /tmp --clobber; then
            echo "::error::Could not download ${ZK_BUNDLE_ASSET} from ${repository} ${tag}."
            echo "::error::The PWA build stages ~97 MB of prover keys and ZKIR that are not in git, and no machine in this pipeline has a compiler."
            echo "::error::Attach the bundle to that release, or move the pin in scripts/zk-artefacts.lock.json forward, and re-run. docs/demo/deployment.md has the command."
            exit 1
          fi
          tar --zstd -xf "/tmp/${ZK_BUNDLE_ASSET}" -C .

      - name: Verify the ZK artefacts against the committed manifests
        run: node .github/workflows/scripts/verify-zk-artefacts.mjs

      # TypeScript imports the generated contract modules from this workspace.
      # They are deliberately ignored build output, so restore and stage them
      # before typechecking rather than relying on a developer's local files.
      # Without this step the typecheck stops at "Cannot find module
      # '../../contracts/stagenet/account/contract/index.js'" (run 34853722025,
      # 2026/09/14, the first run to get past the ancestor check).
      - name: Stage the verified Passport contract modules
        run: npm run prepare:zk --workspace passport-demo

      # zk-params are the in-tab prover's KZG SRS slices — ~45 MB fetched from a
      # public bucket, not part of the contract build and not in the manifests.
      # This deploy sets VITE_MIDNIGHT_PROVING_URL, so the default path uses the
      # proof server and `prepare:zk` only warns when they are absent. They are
      # staged anyway because `.vercel-output-exclude` does not exclude them:
      # they ship today, and `?prover=browser` on the live site needs them.
      - name: Stage the browser prover's parameters
        id: zk-params-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  #v6.1.0
        with:
          key: zk-params-${{ hashFiles('examples/passport-demo/scripts/fetch-zk-params.mjs') }}
          path: examples/passport-demo/public/zk-params

      - name: Fetch the browser prover's parameters
        if: steps.zk-params-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-zk-params.mjs
        working-directory: examples/passport-demo

      # ---------------------------------------------------------------------
      # The gates. Same set verify-demo.yml runs on every pull request, run
      # again here because a release can be cut from a merge that never had one.
      # ---------------------------------------------------------------------
      - name: Rebuild the demo backend the app type-checks against
        run: npm run build --workspace passport-demo-backend

      - name: Typecheck the app
        run: npm run typecheck --workspace passport-demo

      - name: Demo backend unit tests
        run: npm run test --workspace passport-demo-backend

      - name: App unit tests with coverage
        run: npm run test:coverage --workspace passport-demo

      - name: PWA manifest and build-output checks
        run: npm run test:pwa

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: examples/passport-demo

      - name: Tier-1 end-to-end
        run: npx playwright test --project=chromium --grep-invert=@live
        working-directory: examples/passport-demo

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: playwright-report
          path: examples/passport-demo/playwright-report
          retention-days: 7

      # ---------------------------------------------------------------------
      # Build and ship. Same two commands the manual script ran.
      # ---------------------------------------------------------------------
      - name: Build the production bundle
        run: npm run build --workspace passport-demo

      - name: Assemble the Vercel Build Output
        run: node scripts/build-vercel-output.mjs examples/passport-demo

      - name: Refuse to upload an empty Build Output
        run: |
          set -euo pipefail
          output=examples/passport-demo/.vercel/output
          test -f "$output/config.json" || { echo "::error::${output}/config.json is missing."; exit 1; }
          test -f "$output/static/index.html" || { echo "::error::${output}/static/index.html is missing."; exit 1; }
          files="$(find "$output/static" -type f | wc -l)"
          echo "Build Output holds ${files} files, $(du -sh "$output/static" | cut -f1)."
          if [ "$files" -lt 50 ]; then
            echo "::error::Only ${files} files in the Build Output. A real Passport build is thousands. Refusing to upload."
            exit 1
          fi

      - name: Install the Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # The project was resolved, and both its ids checked, before the build —
      # see "Resolve the Vercel project for this target" above.
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.vercel-project.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.project_id }}
        run: |
          set -euo pipefail
          echo "Deploying ${GITHUB_SHA} to ${DEPLOY_TARGET}."
          url="$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${url}"
        working-directory: examples/passport-demo

      - name: Summarise
        run: |
          {
            echo "### Passport demo deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Trigger | ${{ github.event_name }} ${{ github.event.release.tag_name }}${{ inputs.release_tag }} |"
            echo "| Target | ${DEPLOY_TARGET} |"
            echo "| Deployment | ${{ steps.vercel.outputs.url }} |"
            echo "| Live | ${{ env.DEPLOY_TARGET == 'production' && 'https://midnightpassport.com' || 'https://staging.midnightpassport.com' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
