# Runs the demo's gates on every pull request that touches it AND on the merge
# that lands it, so drift is caught before a release is cut rather than after a
# deploy.
#
# WHY THIS EXISTS
# ---------------
# Nothing in CI ran the demo's typecheck or its tests before this workflow.
# The gap that mattered most is the demo backend: `demo-backend/dist` is
# gitignored (root `.gitignore`, `dist/`), the PWA imports the backend through
# that dist's `.d.ts` files, and a stale dist type-checks cleanly against
# exports that no longer exist.
#
# Measured in this repository on 2026/08/26: deleting `parsePassportIncentiveReport`
# from `demo-backend/src/index.ts` and leaving the built dist alone left
# `tsc --noEmit` in `examples/passport-demo` completely green. Rebuilding the
# dist first turned the same tree into
#
#   src/backend.ts(15,3): error TS2724: '"passport-demo-backend"' has no
#   exported member named 'parsePassportIncentiveReport'.
#
# So the ordering in the `gates` job below — build the backend, THEN type-check
# the app — is the whole point of the job, not housekeeping.
#
# THREE JOBS, BECAUSE THE GATES HAVE DIFFERENT INPUTS
# ---------------------------------------------------
# `gates` needs nothing that is not in a git checkout. `suites` needs one more
# install, for a project that is not an npm workspace. `bundle` needs the ~97 MB
# of prover keys and ZKIR that `vite build` stages, which are deliberately not
# in git. See the header of `deploy-demo.yml` for where those come from and why
# no machine in this pipeline can rebuild them.

name: Verify Passport demo

# The two path lists are written out twice on purpose: GitHub Actions rejects
# YAML anchors in a workflow file, so there is no way to say "the same list".
# Keep them identical.
on:
  pull_request:
    paths:
      - 'examples/passport-demo/**'
      - 'examples/passport-balancer/**'
      - 'demo-backend/**'
      - 'packages/connect/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-demo.yml'
      - '.github/workflows/scripts/**'
  # A MERGE IS VERIFIED TOO. Every gate here ran only on the pull request, so a
  # merge commit — a tree no run had ever seen, and the tree a release is cut
  # from — was the first thing to reach a deploy unverified. A push run is also
  # what leaves the ZK bundle cache warm on `main` for the next one.
  push:
    branches: [main]
    paths:
      - 'examples/passport-demo/**'
      - 'examples/passport-balancer/**'
      - 'demo-backend/**'
      - 'packages/connect/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-demo.yml'
      - '.github/workflows/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  ZK_BUNDLE_ASSET: passport-zk-artefacts.tar.zst
  MANAGED_ROOT: examples/passport-balancer/contracts-stagenet/managed

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be established from a plain checkout. This job is the
  # drift guard and it must never be conditional on an artefact being available.
  # ---------------------------------------------------------------------------
  gates:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  #v6.1.0

      - name: Refuse to run against a ref that has no demo
        run: |
          set -euo pipefail
          missing=0
          for path in \
            examples/passport-demo/package.json \
            demo-backend/package.json \
            "${MANAGED_ROOT}/account/contract/index.d.ts" \
            "${MANAGED_ROOT}/midnames/contract/index.d.ts"
          do
            if [ ! -f "$path" ]; then
              echo "::error::${path} is missing on ${GITHUB_REF}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::This workflow verifies examples/passport-demo. Refusing to report success on a ref that does not contain it."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # `vite build` stages these through `prepare-zk-assets.mjs`, which also
      # wants the prover keys and refuses to run without them. The typecheck and
      # the unit tests need only the contract MODULE, and those four files are
      # tracked — so they are staged directly here and this job stays free of
      # the artefact bundle. Verified 2026/08/26 with keys/ and zkir/ moved
      # aside: typecheck and `test:coverage` both pass on the tracked files alone.
      - name: Stage the contract modules the app type-checks against
        run: |
          set -euo pipefail
          # account-v1 is the eleven-circuit build every Passport set up before
          # 2026/09/10 carries; the app opens those with it (accountModuleFor).
          for contract in account account-v1 midnames; do
            # Under `contract/`, not one level flatter: since 2026/09/10 the account
            # module names its own peer as `../../account/contract/index.js`, a path
            # compactc writes literally, and this is the layout that resolves it
            # (see examples/passport-demo/scripts/prepare-zk-assets.mjs).
            destination="examples/passport-demo/contracts/stagenet/${contract}/contract"
            mkdir -p "$destination"
            for file in index.js index.d.ts; do
              source="${MANAGED_ROOT}/${contract}/contract/${file}"
              if [ ! -f "$source" ]; then
                echo "::error::${source} is missing — the tracked contract build is incomplete."
                exit 1
              fi
              cp "$source" "$destination/$file"
            done
          done

      # BEFORE the app's typecheck. See the header.
      - name: Rebuild the demo backend the app type-checks against
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files demo-backend/dist)" ]; then
            echo "::error::demo-backend/dist is tracked in git now, but this step assumes it is generated."
            echo "::error::Either untrack it, or replace this step with: npm run build --workspace passport-demo-backend && git diff --exit-code -- demo-backend/dist"
            exit 1
          fi
          npm run build --workspace passport-demo-backend

      - name: Typecheck the app
        run: npm run typecheck --workspace passport-demo

      - name: Typecheck the demo backend
        run: npx tsc -p demo-backend/tsconfig.json --noEmit

      - name: Demo backend unit tests
        run: npm run test --workspace passport-demo-backend

      - name: App unit tests with coverage
        run: npm run test:coverage --workspace passport-demo

  # ---------------------------------------------------------------------------
  # THE SUITES NOTHING RAN. Three test suites existed in this repository and no
  # workflow executed any of them, so the only thing keeping them passing was
  # whoever last remembered to run them by hand:
  #
  #   packages/connect        166 tests — the pairing protocol partner apps use.
  #                           A break here is a break in somebody else's site.
  #   examples/passport-balancer  621 tests — the fee sponsor. It is the only
  #                           thing that can serve /register-alias and
  #                           /fund-account, and it is shipped by rsync, so its
  #                           tests are the only gate it has before a droplet.
  #   scripts/release-naming  19 tests — the `v<N> - YYYY/MM/DD` derivation
  #                           every promotion is recorded by.
  #
  # Its own job rather than steps on `gates`: none of it depends on the demo
  # backend being rebuilt first, and running it in parallel costs nothing.
  #
  # `npm run lint` at the root is deliberately NOT here. It does not pass on
  # `main` — 2,046 errors over 20 directories, 1,794 of them unrelated to the
  # generated contract modules a checkout lacks (measured 2026/09/15) — so
  # adding it would turn every pull request red on the first run, and adding it
  # with `continue-on-error` would be a gate that cannot fail. Whoever clears
  # the backlog adds the step in the same change.
  # ---------------------------------------------------------------------------
  suites:
    name: Connect, balancer, and release-naming suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  #v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Connect package tests
        run: npx vitest run
        working-directory: packages/connect

      # THE BALANCER RUNS OFF THE ROOT INSTALL, and that is a compromise rather
      # than a design. It is not an npm workspace and carries its own
      # `package-lock.json`, so installing that lockfile first would be the
      # honest thing — except `npm ci` refuses it: `package.json` asks for
      # `@midnight-ntwrk/compact-runtime@0.19.0-rc.0` and the lock beside it
      # records `0.19.0`, which is a lockfile that has drifted from the manifest
      # it describes (first run of this job, 2026/09/15). Regenerating it is not
      # this change's business — locks here are rebuilt from the previous lock
      # and the resolutions diffed, never recreated.
      #
      # Everything its test bundles import at run time — `wallet-sdk`,
      # `ledger-v9`, `@polkadot/api`, `zkir-v2`, `rxjs`, `ws` — is hoisted to
      # the root tree by the install above, and `esbuild` with them, so the
      # suite runs. Note that the hoisted `compact-runtime` is 0.16.0, not the
      # 0.19.0-rc.0 this package asks for; the tests pass against it, and
      # whoever repairs the lockfile should put `npm ci` back here in the same
      # change.
      - name: Balancer tests
        run: npm test
        working-directory: examples/passport-balancer

      - name: Release-naming tests
        run: npm run test:release-naming

  # ---------------------------------------------------------------------------
  # The gates that need a real `vite build`, and therefore the ZK artefacts.
  # ---------------------------------------------------------------------------
  bundle:
    name: PWA checks and tier-1 end-to-end
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  #v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore the pinned ZK artefacts
        id: zk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  #v4.3.0
        with:
          key: zk-artefacts-${{ hashFiles('examples/passport-balancer/contracts-stagenet/managed/*/compiler/contract-manifest.json') }}
          path: |
            examples/passport-balancer/contracts-stagenet/managed/account/keys
            examples/passport-balancer/contracts-stagenet/managed/account/zkir
            examples/passport-balancer/contracts-stagenet/managed/midnames/keys
            examples/passport-balancer/contracts-stagenet/managed/midnames/zkir

      # FETCHED BY TAG, FROM THE PIN. This used to be a bare
      # `gh release download`, which takes whatever is Latest when the step
      # runs — so a pull request was built against a bundle nothing in the tree
      # named, and against a different one after the next release. The pin in
      # `scripts/zk-artefacts.lock.json` is the same asset a Vercel builder and
      # a developer on a fresh clone get, and it is a tracked file, so moving it
      # is a reviewable change rather than a side effect of publishing.
      - name: Fetch the pinned ZK artefact bundle
        id: zk-fetch
        if: steps.zk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(node -p 'JSON.parse(require("node:fs").readFileSync("scripts/zk-artefacts.lock.json", "utf8")).tag')"
          repository="$(node -p 'JSON.parse(require("node:fs").readFileSync("scripts/zk-artefacts.lock.json", "utf8")).repository')"
          echo "Downloading ${ZK_BUNDLE_ASSET} from ${repository} ${tag} (scripts/zk-artefacts.lock.json)."
          if gh release download "${tag}" --repo "${repository}" --pattern "${ZK_BUNDLE_ASSET}" --dir /tmp --clobber 2>/tmp/gh.err; then
            tar --zstd -xf "/tmp/${ZK_BUNDLE_ASSET}" -C .
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### The ZK artefact bundle could not be fetched"
              echo
              echo "\`${ZK_BUNDLE_ASSET}\` was not downloadable from **${repository} ${tag}**, the"
              echo "release pinned in \`scripts/zk-artefacts.lock.json\`, and the cache held no copy."
              echo "Those ~97 MB of prover keys and ZKIR are not in git and no machine in this"
              echo "pipeline has a compiler, so \`npm run test:pwa\` and the Playwright tier-1 run"
              echo "cannot run at all."
              echo
              echo "Either the pinned release lost its asset, or the pin is stale. Move it forward"
              echo "in the same commit that lands new manifests — \`docs/demo/deployment.md\`."
              echo
              echo "\`gh release download\` said:"
              echo '```'
              cat /tmp/gh.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note whether the build-dependent gates can run
        id: buildable
        run: |
          set -euo pipefail
          if [ "${{ steps.zk-cache.outputs.cache-hit }}" = "true" ] || [ "${{ steps.zk-fetch.outputs.available }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # A JOB THAT RAN NO GATES IS NOT GREEN (2026/09/15). Until today an
      # unavailable bundle left every step below skipped and the job reported
      # success, so "PWA checks and tier-1 end-to-end" was a green tick next to
      # a build that had never been attempted — on exactly the pull requests
      # most likely to have broken it, since the bundle goes missing when the
      # pin or the manifests move. The reason was written to the job summary,
      # which nobody reads when the check is green.
      #
      # The `if: steps.buildable.outputs.ok == 'true'` guards below are left in
      # place behind this: this is the braces, they are the belt.
      - name: Refuse to report success without the ZK artefact bundle
        if: steps.buildable.outputs.ok != 'true'
        run: |
          echo "::error::The ZK artefact bundle is unavailable, so the PWA check and the tier-1 end-to-end run could not be attempted."
          echo "::error::Refusing to report success on gates that did not run. The step summary above says what gh release download answered; docs/demo/deployment.md says how to fix the pin."
          exit 1

      # Every file the manifests name, hashed and compared. This is what stops a
      # bundle from a DIFFERENT build of the same contracts reaching a build:
      # two builds are two verifier keys, and the deployed contract only knows
      # one of them. Verified locally 2026/08/26 — 88 files pass in 0.2s, and
      # appending a single byte to one ZKIR file fails the step.
      - name: Verify the ZK artefacts against the committed manifests
        if: steps.buildable.outputs.ok == 'true'
        run: node .github/workflows/scripts/verify-zk-artefacts.mjs

      - name: Rebuild the demo backend
        if: steps.buildable.outputs.ok == 'true'
        run: npm run build --workspace passport-demo-backend

      # `test:pwa` is `npm run build && npm run check:pwa` in the workspace.
      - name: PWA manifest and build-output checks
        if: steps.buildable.outputs.ok == 'true'
        run: npm run test:pwa

      - name: Install Chromium
        if: steps.buildable.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: examples/passport-demo

      # Tier 1 only. `stagenet.live.spec.ts` is tagged `@live`, and it also
      # self-skips without RUN_LIVE=1 — grep-invert is belt, the skip is braces.
      # Selecting by tag rather than by filename keeps this working when specs
      # are renamed.
      - name: Tier-1 end-to-end
        if: steps.buildable.outputs.ok == 'true'
        run: npx playwright test --project=chromium --grep-invert=@live
        working-directory: examples/passport-demo

      - name: Upload the Playwright report on failure
        if: failure() && steps.buildable.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: playwright-report
          path: examples/passport-demo/playwright-report
          retention-days: 7
