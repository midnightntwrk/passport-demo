name: Verify Passport builder
on:
  pull_request:
    paths:
      - 'examples/passport-builder/**'
      - 'packages/connect/**'
      - 'skills/midnight-passport/**'
      - '.github/workflows/verify-builder.yml'
  push:
    branches: [main]
    paths:
      - 'examples/passport-builder/**'
      - 'packages/connect/**'
      - 'skills/midnight-passport/**'
      - '.github/workflows/verify-builder.yml'
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/passport-builder/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @midnight-passport/connect
      - run: npm ci
        working-directory: examples/passport-builder
      - run: npm test
        working-directory: examples/passport-builder
      - run: npm run build
        working-directory: examples/passport-builder
