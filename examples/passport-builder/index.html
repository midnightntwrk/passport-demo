<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Build, compile, and deploy Midnight apps with AI and Midnight Passport." />
    <link rel="icon" href="/src/assets/midnight-symbol.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>(function(){try{var p=localStorage.getItem('passport-theme');var r=document.documentElement;if(p==='system'){r.style.colorScheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}else{p=p==='dark'?'dark':'light';r.setAttribute('data-theme',p);r.style.colorScheme=p;}}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <title>Passport Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
