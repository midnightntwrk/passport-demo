<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme, before anything paints. This is the literal value of
         `themeInitScript` in src/lib/theme.ts — keep the two in step. Without
         it a stored dark preference would flash the light default first. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('passport-theme');
          var r = document.documentElement;
          if (p === 'light' || p === 'dark') {
            r.setAttribute('data-theme', p);
            r.style.colorScheme = p;
          } else if (p === 'system') {
            r.removeAttribute('data-theme');
            r.style.colorScheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            r.setAttribute('data-theme', 'dark');
            r.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0a0a14" />
    <meta name="application-name" content="Midnight Passport" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Passport" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Your Midnight wallet, encrypted Passport state, and account permissions in one installable client."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/skunk/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <title>Midnight Passport</title>
  </head>
  <body>
    <!-- Splash: pure inline HTML/CSS so it paints instantly, long before the
         main bundle parses. Theme comes from the data-theme stamp above.
         main.tsx fades it out once React has mounted (min 500ms on screen so
         a fast load reads as a beat, not a flash). -->
    <style>
      #mn-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a14;
        transition: opacity 0.32s ease;
      }
      :root[data-theme='light'] #mn-splash { background: #f7f5f2; }
      #mn-splash.mn-splash-done { opacity: 0; pointer-events: none; }
      #mn-splash img { width: 172px; height: auto; }
      #mn-splash .mn-splash-kicker {
        margin: 0;
        color: #8b8899;
        font-family: 'Barlow', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      :root[data-theme='light'] #mn-splash .mn-splash-kicker { color: #6c6877; }
      #mn-splash .mn-splash-pulse { animation: mn-splash-pulse 1.6s ease-in-out infinite; }
      @keyframes mn-splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mn-splash .mn-splash-pulse { animation: none; }
        #mn-splash { transition: none; }
      }
    </style>
    <div id="mn-splash" role="status" aria-label="Midnight Passport is loading">
      <img class="mn-splash-pulse" src="/skunk/logo.svg" alt="" />
      <p class="mn-splash-kicker">Passport</p>
    </div>
    <script>window.__mnSplashShownAt = Date.now();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
