  <path d="M280 378 L 291 398 L 302 374 Z" fill="#F7F5F2" stroke="#16161f" stroke-width="5" stroke-linejoin="round"/>

  <!-- blush marks -->
  <path d="M168 340 l 20 -8 M174 356 l 20 -8" stroke="#FF79FC" stroke-width="7" stroke-linecap="round"/>
  <path d="M312 332 l 20 8 M306 348 l 20 8" stroke="#FF79FC" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M84 148 L 92 172 L 116 180 L 92 188 L 84 212 L 76 188 L 52 180 L 76 172 Z" fill="#A700FF"/>
  <path d="M116 100 l 0 24 M104 112 l 24 0" stroke="#A700FF" stroke-width="7" stroke-linecap="round"/>
  <path d="M118 408 l 0 28 M104 422 l 28 0" stroke="#F7F5F2" stroke-width="7" stroke-linecap="round"/>
